################################################################################
# docker-compose.yaml
# Campus Parking Management System - Hyperledger Fabric Network
# Containers: 3 Raft orderers + 8 peers (2 per org)
################################################################################

version: "3.8"

networks:
  campus-nets:
    external: true

volumes:
  orderer0-data:
    external: true
  orderer1-data:
    external: true
  orderer2-data:
    external: true
  peer0-admin-data:
    external: true
  peer1-admin-data:
    external: true
  peer0-finance-data:
    external: true
  peer1-finance-data:
    external: true
  peer0-security-data:
    external: true
  peer1-security-data:
    external: true
  peer0-studentaffairs-data:
    external: true
  peer1-studentaffairs-data:
    external: true

services:

  ##############################################################################
  # ORDERER NODES (Raft consensus - 3 nodes for fault tolerance)
  ##############################################################################

  orderer0.university.com:
    image: hyperledger/fabric-orderer:latest
    container_name: orderer0.university.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - FABRIC_CFG_PATH=/var/hyperledger/config
    volumes:
      - ./config/orderer/orderer.yaml:/var/hyperledger/config/orderer.yaml
      - ./channel-artifacts/orderer/genesis.block:/var/hyperledger/config/genesis.block
      - ./crypto-config/ordererOrganizations/university.com/orderers/orderer0.university.com/msp:/var/hyperledger/msp
      - ./crypto-config/ordererOrganizations/university.com/orderers/orderer0.university.com/tls:/var/hyperledger/tls
      - orderer0-data:/var/ledger
    ports:
      - "7050:7050"
      - "8443:8443"
    networks:
      campus-nets:
        aliases:
          - orderer0.university.com
    command: orderer

  orderer1.university.com:
    image: hyperledger/fabric-orderer:latest
    container_name: orderer1.university.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - FABRIC_CFG_PATH=/var/hyperledger/config
    volumes:
      - ./config/orderer/orderer.yaml:/var/hyperledger/config/orderer.yaml
      - ./channel-artifacts/orderer/genesis.block:/var/hyperledger/config/genesis.block
      - ./crypto-config/ordererOrganizations/university.com/orderers/orderer1.university.com/msp:/var/hyperledger/msp
      - ./crypto-config/ordererOrganizations/university.com/orderers/orderer1.university.com/tls:/var/hyperledger/tls
      - orderer1-data:/var/ledger
    ports:
      - "7060:7050"
      - "8444:8443"
    networks:
      campus-nets:
        aliases:
          - orderer1.university.com
    command: orderer
    depends_on:
      - orderer0.university.com

  orderer2.university.com:
    image: hyperledger/fabric-orderer:latest
    container_name: orderer2.university.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - FABRIC_CFG_PATH=/var/hyperledger/config
    volumes:
      - ./config/orderer/orderer.yaml:/var/hyperledger/config/orderer.yaml
      - ./channel-artifacts/orderer/genesis.block:/var/hyperledger/config/genesis.block
      - ./crypto-config/ordererOrganizations/university.com/orderers/orderer2.university.com/msp:/var/hyperledger/msp
      - ./crypto-config/ordererOrganizations/university.com/orderers/orderer2.university.com/tls:/var/hyperledger/tls
      - orderer2-data:/var/ledger
    ports:
      - "7070:7050"
      - "8445:8443"
    networks:
      campus-nets:
        aliases:
          - orderer2.university.com
    command: orderer
    depends_on:
      - orderer0.university.com

  ##############################################################################
  # UNIVERSITY ADMIN ORG PEERS (permit issuance and management)
  ##############################################################################

  peer0.admin.university.com:
    image: hyperledger/fabric-peer:latest
    container_name: peer0.admin.university.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - FABRIC_CFG_PATH=/var/hyperledger/config
      - CORE_PEER_LOCALMSPID=UniversityAdminMSP
      - CORE_PEER_ID=peer0.admin.university.com
      - CORE_PEER_ADDRESS=peer0.admin.university.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.admin.university.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.admin.university.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.admin.university.com:7051
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=campus-nets
    volumes:
      - ./config/admin/core.yaml:/var/hyperledger/config/core.yaml
      - ./crypto-config/peerOrganizations/admin.university.com/peers/peer0.admin.university.com/msp:/var/hyperledger/msp
      - ./crypto-config/peerOrganizations/admin.university.com/peers/peer0.admin.university.com/tls:/var/hyperledger/tls
      - /var/run/docker.sock:/var/run/docker.sock
      - peer0-admin-data:/var/hyperledger/production
    ports:
      - "7051:7051"
      - "7052:7052"
    networks:
      campus-nets:
        aliases:
          - peer0.admin.university.com
    command: peer node start
    depends_on:
      - orderer0.university.com

  peer1.admin.university.com:
    image: hyperledger/fabric-peer:latest
    container_name: peer1.admin.university.com
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - FABRIC_CFG_PATH=/var/hyperledger/config
      - CORE_PEER_LOCALMSPID=UniversityAdminMSP
      - CORE_PEER_ID=peer1.admin.university.com
      - CORE_PEER_ADDRESS=peer1.admin.university.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer1.admin.university.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.admin.university.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.admin.university.com:7051
      - CORE_VM_ENDPOINT=unix:///var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=campus-nets
    volumes:
      - ./config/admin/core.yaml:/var/hyperledger/config/core.yaml
      - ./crypto-config/peerOrganizations/admin.university.com/peers/peer1.admin.university.com/msp:/var/hyperledger/msp
      - ./crypto-config/peerOrganizations/admin.university.com/peers/peer1.admin.university.com/tls:/var/hyperledger/tls
      - /var/run/docker.sock:/var/run/docker.sock
      - peer1-admin-data:/var/hyperledger/production
    ports:
      - "7055:7051"
      - "7056:7052"
    networks:
      campus-nets:
        aliases:
          - peer1.admin.university.com
    command: peer node start
    depends_on:
      - orderer0.university.com

