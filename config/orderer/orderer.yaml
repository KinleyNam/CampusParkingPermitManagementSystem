################################################################################
# orderer.yaml
# Campus Parking Management System - Orderer Runtime Configuration
# Used by orderer0, orderer1, orderer2 (paths set via env vars in docker-compose)
################################################################################

General:
  ListenAddress: 0.0.0.0
  ListenPort: 7050
  TLS:
    Enabled: true
    PrivateKey: /var/hyperledger/tls/server.key
    Certificate: /var/hyperledger/tls/server.crt
    RootCAs:
      - /var/hyperledger/tls/ca.crt
  Keepalive:
    ServerMinInterval: 60s
    ServerInterval: 7200s
    ServerTimeout: 20s
  MaxRecvMsgSize: 104857600
  MaxSendMsgSize: 104857600
  Cluster:
    SendBufferSize: 10
    ClientCertificate: /var/hyperledger/tls/server.crt
    ClientPrivateKey: /var/hyperledger/tls/server.key
  BootstrapMethod: file
  BootstrapFile: /var/hyperledger/config/genesis.block
  LocalMSPDir: /var/hyperledger/msp
  LocalMSPID: OrdererMSP
  Profile:
    Enabled: false
    Address: 0.0.0.0:6060
  BCCSP:
    Default: SW
    SW:
      Hash: SHA2
      Security: 256
      FileKeyStore:
        KeyStore:
  Authentication:
    TimeWindow: 15m

FileLedger:
  Location: /var/ledger

Debug:
  BroadcastTraceDir:
  DeliverTraceDir:

Operations:
  ListenAddress: 127.0.0.1:8443
  TLS:
    Enabled: false

Metrics:
  Provider: disabled

Consensus:
  WALDir: /var/hyperledger/production/orderer/etcdraft/wal
  SnapDir: /var/hyperledger/production/orderer/etcdraft/snapshot
