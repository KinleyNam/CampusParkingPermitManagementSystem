      - CORE_PEER_CHAINCODEADDRESS=peer1.security.university.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.security.university.com:9051
