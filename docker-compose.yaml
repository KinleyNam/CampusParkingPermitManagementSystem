      - CORE_PEER_CHAINCODEADDRESS=peer1.finance.university.com:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.finance.university.com:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.finance.university.com:8051
